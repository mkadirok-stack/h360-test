<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>İlan Detayı | Hammadde360</title>
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/i18n-ru.js"></script>
  <script src="js/i18n.js"></script>
</head>
<body>
<div id="site-top"></div>
<main class="section">
  <div class="container narrow" id="detail"><p class="sub">Yükleniyor...</p></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/support.js"></script>
<script>
(async () => {
  const { sb, esc, money, tl, waLink, dateTR } = H;
  const $ = id => document.getElementById(id);
  const me = await H.init({ require: 'login' });
  if (!me) return;
  const box = document.getElementById('detail');
  const id = Number(new URLSearchParams(location.search).get('id'));
  if (!id) { box.innerHTML = '<p class="sub">İlan bulunamadı.</p>'; return; }
  const { data: l, error } = await sb.from('public_listings').select('*').eq('id', id).maybeSingle();
  if (error || !l) { box.innerHTML = '<p class="sub">İlan bulunamadı veya yayından kaldırılmış.</p><a class="btn" href="ilanlar.html">İlanlara dön</a>'; return; }

  const { data: defs } = await sb.from('sector_attributes').select('*').order('sort');
  const defMap = {}; (defs || []).forEach(d => { defMap[d.key] = d; });
  const fact = (k, v) => '<div><dt>' + k + '</dt><dd>' + esc(v) + '</dd></div>';
  const productFacts =
    (l.sector ? fact(t('Sektör'), l.sector) : '') + (l.material ? fact(t('Ürün grubu'), l.material) : '') +
    (l.brand ? fact(t('Marka'), l.brand) : '') + (l.product_code ? fact(t('Ürün kodu'), l.product_code) : '') +
    Object.keys(l.attrs || {}).filter(k => defMap[k] && l.attrs[k] !== '' && l.attrs[k] !== null)
      .map(k => fact(t(defMap[k].label), l.attrs[k] + (defMap[k].unit ? ' ' + defMap[k].unit : ''))).join('');

  document.title = l.title + ' | Hammadde360';
  const u = ' ' + t('/ {u} + %{v} KDV', { u: esc(t(l.unit || 'birim')), v: Number(l.vat_pct ?? 20) });
  const price = l.campaign_price
    ? '<s>' + money(l.list_price) + '</s> <strong class="camp">' + money(l.campaign_price) + '</strong>'
    : '<strong>' + money(l.list_price) + '</strong>';
  const msg = t('Merhaba, #{id} numaralı "{title}" ilanı hakkında bilgi almak istiyorum.', { id: l.id, title: l.title });

  box.innerHTML =
    '<p><a href="ilanlar.html">← İlanlara dön</a></p>' +
    (l.category ? '<span class="badge">' + esc(l.category) + '</span>' : '') +
    '<h2>' + esc(l.title) + '</h2>' +
    '<p class="meta">' + t('İlan #{id} · {d}', { id: l.id, d: dateTR(l.published_at) }) + '</p>' +
    '<div class="pricebox"><div class="price big">' + price + '<small>' + u + '</small><div class="tlp">' + tl(l.campaign_price || l.list_price, H.fx && H.fx.usd_sell) + u + ' ' + t('(TCMB döviz satış kuru)') + '</div>' +
    '<div class="cashnote">' + t('Nakit ödemede %{n} iskonto:', { n: H.cfg.CASH_DISCOUNT_PCT }) + ' <b>' + money((l.campaign_price || l.list_price) * (1 - H.cfg.CASH_DISCOUNT_PCT / 100)) + '</b>' + u + '</div></div>' +
    '<a class="btn wa-cta" target="_blank" rel="noopener" href="' + waLink(msg) + '">WhatsApp ile sor / teklif ver</a><p class="hint">' + t('Talebinizde en kısa sürede dönüş sağlanacaktır.') + '</p></div>' +
    '<p class="hint">' + t('Fiyatlar USD cinsindendir ve KDV hariçtir; bu ilan için KDV oranı %{v} olup fiyata ayrıca eklenir. Faturalandırma, fatura tarihindeki TCMB döviz satış kuru esas alınarak TL olarak yapılır.', { v: Number(l.vat_pct ?? 20) }) + '</p>' + '<dl class="facts"><div><dt>Miktar</dt><dd>' + esc(l.quantity) + ' ' + esc(t(l.unit)) + '</dd></div>' + '<div><dt>' + t('Stok durumu') + '</dt><dd><span class="chip ' + H.stock(l).cls + '">' + esc(H.stock(l).label) + '</span>' + (l.stock_updated_at ? '<br><small>' + t('Stok güncelleme: {d}', { d: dateTR(l.stock_updated_at) }) + '</small>' : '') + '</dd></div>' + '<div><dt>' + t('Min. sipariş') + '</dt><dd>1 ' + t('palet') + ' (' + Number(l.pallet_kg || 1000).toLocaleString('tr-TR') + ' kg)</dd></div>' + productFacts +
    (l.city ? '<div><dt>Depo teslim</dt><dd>' + esc(l.city) + '</dd></div>' : '') + '</dl>' +
    (l.description ? '<h3>Açıklama</h3><p class="desc">' + esc(l.description) + '</p>' : '');
  // Palet bazlı fiyat tablosu + hesaplayıcı (minimum sipariş 1 palet)
  const pq = Number(l.pallet_qty || 1), fxr = H.fx && H.fx.usd_sell;
  const tiers = [{ min_pallets: 1, price: l.list_price, campaign: l.campaign_price }].concat(l.price_tiers_public || []);
  const maxPallets = Math.max(1, Math.floor(Number(l.quantity) / pq));
  const tierOf = n => tiers.filter(x => x.min_pallets <= n).pop();
  const eff = x => (x.campaign || x.price);
  const rowsHtml = tiers.map((x, i) => {
    const nxt = tiers[i + 1], lab = i === 0 && !nxt ? '1 ' + t('palet') : (nxt ? x.min_pallets + '–' + (nxt.min_pallets - 1) + ' ' + t('palet') : t('{n} palet ve üzeri', { n: x.min_pallets }));
    const pr = x.campaign ? '<s>' + money(x.price) + '</s> <strong class="camp">' + money(x.campaign) + '</strong>' : '<strong>' + money(x.price) + '</strong>';
    return '<tr><td>' + lab + '</td><td>' + esc(x.min_pallets * pq) + '+ ' + esc(t(l.unit)) + '</td><td>' + pr + '</td><td>' + tl(eff(x), fxr) + '</td></tr>';
  }).join('');
  box.insertAdjacentHTML('beforeend', '<h3>' + t('Palet bazlı fiyat') + '</h3><p class="hint">' + t('Minimum sipariş: 1 palet ({q} {u})', { q: Number(l.pallet_kg || 1000).toLocaleString('tr-TR'), u: 'kg' }) + '</p>' +
    '<div class="tablewrap"><table class="table ptable"><thead><tr><th>' + t('Palet') + '</th><th>' + t('Miktar') + '</th><th>' + t('Birim fiyat (USD, + KDV)') + '</th><th>' + t('TL karşılığı') + '</th></tr></thead><tbody>' + rowsHtml + '</tbody></table></div>' +
    '<div class="calc"><label>' + t('Palet sayısı') + '<input id="calc-n" type="number" min="1" max="' + maxPallets + '" step="1" value="1"></label><div id="calc-out"></div></div>');
  const calc = () => {
    let n = Math.floor(Number($('calc-n').value) || 1); n = Math.min(Math.max(n, 1), maxPallets);
    const x = tierOf(n), qty = n * pq, unit = eff(x), total = unit * qty;
    $('calc-out').innerHTML = '<b>' + n + ' ' + t('palet') + ' = ' + qty + ' ' + esc(t(l.unit)) + '</b> · ' + t('Birim fiyat') + ': ' + money(unit) + ' · ' + t('Toplam') + ': <b>' + money(total) + '</b> + ' + t('KDV') + (fxr ? ' <small>(' + tl(total, fxr) + ')</small>' : '');
    const wa = box.querySelector('.wa-cta');
    if (wa) wa.href = waLink(t('Merhaba, #{id} numaralı "{title}" ilanı için {n} palet ({q} {u}) hakkında bilgi almak istiyorum.', { id: l.id, title: l.title, n: n, q: qty, u: t(l.unit) }));
  };
  $('calc-n').addEventListener('input', calc); calc();
  box.insertAdjacentHTML('beforeend', '<p class="hint">' + t('Fiyatlar depo teslimdir (ürünün bulunduğu şehirde). Nakliye dahil fiyat için bizimle iletişime geçebilirsiniz.') + ' <a target="_blank" rel="noopener" href="' + waLink(t('Merhaba, #{id} numaralı "{title}" ilanı için adresime teslim (nakliye dahil) fiyat almak istiyorum.', { id: l.id, title: l.title })) + '">' + t('Adrese teslim fiyatı iste') + '</a></p>');
  const favOn = (await H.loadFavs()).has(l.id);
  box.insertAdjacentHTML('beforeend', '<p><button type="button" class="btn btn-sm" id="favbtn">' + (favOn ? '★ ' + t('Favorilerden çıkar') : '☆ ' + t('Favorilere ekle')) + '</button></p>');
  $('favbtn').addEventListener('click', async () => {
    const on = await H.toggleFav(l); if (on === null) return;
    $('favbtn').textContent = (on ? '★ ' + t('Favorilerden çıkar') : '☆ ' + t('Favorilere ekle'));
  });
  // TDS: üreticinin bağlantısı (TDS ajanı bulur) ve/veya satıcının yüklediği PDF
  const tds = [];
  if (l.product_tds_url) tds.push('<a class="btn btn-sm" target="_blank" rel="nofollow noopener" href="' + esc(l.product_tds_url) + '">' + t('TDS (üretici)') + '</a>');
  if (l.tds_path) {
    const sg = await sb.storage.from('tds').createSignedUrl(l.tds_path, 3600);
    if (sg.data) tds.push('<a class="btn btn-sm" target="_blank" rel="noopener" href="' + esc(sg.data.signedUrl) + '">' + t('TDS indir (PDF)') + '</a>');
  }
  if (tds.length) box.insertAdjacentHTML('beforeend', '<h3>' + t('Teknik veri sayfası (TDS)') + '</h3><p>' + tds.join(' ') + '</p>');
})();
</script>
<script src="js/analytics.js" defer></script>
</body>
</html>
