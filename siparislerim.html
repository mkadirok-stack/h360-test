<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Siparişlerim | Hammadde360</title>
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/i18n-ru.js"></script>
  <script src="js/i18n.js"></script>
</head>
<body>
<div id="site-top"></div>
<main class="section alt">
  <div class="container narrow">
    <h2>Siparişlerim</h2>
    <p class="sub">Sipariş verdiğinizde proformanız e-postanıza gönderilir. Kaşeli ve imzalı proformayı buradan yüklediğinizde sipariş kesinleşir ve ödeme bilgileri açılır.</p>
    <div id="orders"><p class="sub">Yükleniyor...</p></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/support.js"></script>
<script>
(async () => {
  const { sb, esc, money, dateTR } = H;
  const me = await H.init({ require: ['buyer', 'seller', 'both', 'admin'] });
  if (!me) return;
  const box = document.getElementById('orders');
  const ST = {
    proforma_pending: ['Proforma hazırlanıyor', 'b-wait'], proforma_sent: ['Proforma gönderildi — imzalı belge bekleniyor', 'b-wait'],
    signed_uploaded: ['Sipariş kesinleşti — ödeme bekleniyor', 'b-ok'], paid: ['Ödeme alındı', 'b-ok'],
    cancelled: ['İptal edildi', 'b-bad'], expired: ['Proforma süresi doldu', 'b-bad']
  };
  const num = n => Number(n).toLocaleString('tr-TR', { maximumFractionDigits: 3 });
  let timer = null;

  async function pay(o) {
    const r = await sb.rpc('order_payment_info', { p_id: o.id });
    if (r.error) return '<p class="form-note err">' + esc(r.error.message) + '</p>';
    const p = r.data, fx = H.fx && H.fx.usd_sell;
    return '<div class="pricebox"><h4>Ödeme bilgileri (havale / EFT)</h4><dl class="facts">' +
      '<div><dt>Banka</dt><dd>' + esc(p.bank || '') + '</dd></div>' +
      '<div><dt>IBAN</dt><dd><b>' + esc(p.iban || '') + '</b></dd></div>' +
      '<div><dt>Hesap sahibi</dt><dd>' + esc(p.account_name || '') + '</dd></div>' +
      '<div><dt>Tutar</dt><dd><b>' + money(p.total) + '</b> (KDV dahil)' + (fx ? '<br><small>' + H.tl(p.total, fx) + ' — bilgi amaçlı; faturalandırma fatura tarihindeki TCMB döviz satış kuru ile yapılır</small>' : '') + '</dd></div>' +
      '<div><dt>Açıklama</dt><dd><b>' + esc(p.proforma_no) + '</b> yazınız</dd></div></dl>' +
      '<p class="hint">Nakit (peşin) ödemelerde %' + H.cfg.CASH_DISCOUNT_PCT + ' iskonto uygulanır; ödeme sonrası teyit için bizimle iletişime geçebilirsiniz.</p></div>';
  }

  async function card(o) {
    const s = ST[o.status] || [o.status, ''];
    let ek = '';
    if (o.status === 'proforma_pending') ek = '<p class="hint">Proformanız hazırlanıyor; birkaç dakika içinde e-postanıza gelecek ve buradan indirilebilecek.</p>';
    if (o.status === 'proforma_sent') {
      let dl = '';
      if (o.proforma_path) { const sg = await sb.storage.from('order-docs').createSignedUrl(o.proforma_path, 3600); if (sg.data) dl = '<a class="btn btn-sm" target="_blank" rel="noopener" href="' + esc(sg.data.signedUrl) + '">Proformayı indir (PDF)</a>'; }
      ek = '<p>' + dl + '</p><form class="form up-form" data-id="' + o.id + '" data-no="' + esc(o.proforma_no) + '" novalidate>' +
        '<label>Kaşeli ve imzalı proforma (fotoğraf veya PDF, en fazla 5 MB)<input type="file" name="doc" accept="application/pdf,image/jpeg,image/png,image/webp" required></label>' +
        '<button class="btn btn-sm" type="submit">Yükle ve siparişi kesinleştir</button><p class="form-note" role="status"></p></form>' +
        '<p class="hint">Geçerlilik: ' + dateTR(o.valid_until) + '. Stok, sipariş onayında teyide tabidir.</p>';
    }
    if (o.status === 'signed_uploaded' || o.status === 'paid') ek = await pay(o);
    return '<article class="card listing" id="o' + o.id + '"><h3>' + esc(o.proforma_no) + ' <span class="badge ' + s[1] + '">' + esc(s[0]) + '</span></h3>' +
      '<p class="meta">' + esc(o.title) + ' · ' + o.pallets + ' palet · ' + num(o.quantity) + ' ' + esc(o.unit) + '</p>' +
      '<p class="meta">Birim fiyat ' + money(o.unit_price) + ' · Ara toplam ' + money(o.subtotal) + ' · KDV %' + num(o.vat_pct) + ' · <b>Toplam ' + money(o.total) + '</b></p>' +
      '<p class="meta">Sipariş tarihi: ' + dateTR(o.created_at) + '</p>' + ek + '</article>';
  }

  async function load() {
    const { data, error } = await sb.from('orders').select('*').eq('buyer_id', me.id).order('created_at', { ascending: false });
    if (error) { box.innerHTML = '<p class="form-note err">Siparişler yüklenemedi.</p>'; return; }
    if (!data.length) { box.innerHTML = '<p class="sub">Henüz siparişiniz yok. <a href="ilanlar.html">İlanlara göz atın</a>.</p>'; return; }
    box.innerHTML = (await Promise.all(data.map(card))).join('');
    clearTimeout(timer);
    if (data.some(o => o.status === 'proforma_pending')) timer = setTimeout(load, 10000);
  }

  box.addEventListener('submit', async e => {
    const form = e.target.closest('.up-form'); if (!form) return;
    e.preventDefault();
    const note = form.querySelector('.form-note'), btn = form.querySelector('button'), file = form.elements.doc.files[0];
    const say = (m, c) => { note.className = 'form-note ' + (c || ''); note.textContent = m; };
    if (!file) return say('Lütfen bir dosya seçin.', 'err');
    if (file.size > 5 * 1024 * 1024) return say('Dosya en fazla 5 MB olmalıdır.', 'err');
    if (!/^(application\/pdf|image\/(jpeg|png|webp))$/.test(file.type)) return say('Yalnızca PDF, JPG, PNG veya WEBP yüklenebilir.', 'err');
    btn.disabled = true; say('Yükleniyor...');
    const ext = { 'application/pdf': 'pdf', 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' }[file.type];
    const path = me.id + '/signed-' + form.dataset.no + '-' + Date.now() + '.' + ext;
    const up = await sb.storage.from('order-docs').upload(path, file, { contentType: file.type });
    if (up.error) { btn.disabled = false; return say('Yüklenemedi: ' + up.error.message, 'err'); }
    const r = await sb.rpc('order_signed', { p_id: Number(form.dataset.id), p_path: path });
    if (r.error) { btn.disabled = false; return say(r.error.message, 'err'); }
    await load();
    const el = document.getElementById('o' + form.dataset.id); if (el) el.scrollIntoView();
  });

  await load();
})();
</script>
<script src="js/analytics.js" defer></script>
</body>
</html>
