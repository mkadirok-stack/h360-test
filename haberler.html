<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Haberler | Hammadde360</title>
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/i18n-ru.js"></script>
  <script src="js/i18n.js"></script>
</head>
<body>
<div id="site-top"></div>
<main class="section">
  <div class="container">
    <section id="prices-wrap" style="margin-bottom:32px">
      <h2>Üretici Fiyat Duyuruları</h2>
      <div id="prices" class="newslist"><p class="sub">Yükleniyor...</p></div>
    </section>
    <h2>Sektörden Haberler</h2>
    <p class="sub">Plastik sektöründen güncel haberler</p>
    <div id="news" class="newslist"><p class="sub">Yükleniyor...</p></div>
    <p class="hint">Haberler otomatik taranır ve kısaca özetlenir. Ayrıntı ve doğruluk için lütfen kaynağı kontrol edin.</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/support.js"></script>
<script>
(async () => {
  const { sb, esc, dateTR } = H;
  await H.init();
  // Üretici fiyat duyuruları: yalnızca giriş yapmış üyelere
  const pbox = document.getElementById('prices');
  const sess = (await sb.auth.getSession()).data.session;
  if (!sess) {
    pbox.innerHTML = '<p class="sub">' + t('Fiyat duyuruları üyelere özeldir.') + ' <a href="giris.html">' + t('Giriş yap veya üye ol') + '</a></p>';
  } else {
    const pr = await sb.from('price_notices').select('*').eq('visible', true).order('created_at', { ascending: false }).limit(30);
    if (pr.error) pbox.innerHTML = '<p class="form-note err">' + t('Fiyat duyuruları yüklenemedi.') + '</p>';
    else if (!pr.data.length) pbox.innerHTML = '<p class="sub">' + t('Henüz fiyat duyurusu yok.') + '</p>';
    else pbox.innerHTML = pr.data.map(p => {
      const amt = (p.direction === 'zam' ? '+' : '−') + Number(p.amount).toLocaleString('tr-TR') + (p.unit === '%' ? ' %' : ' ' + p.unit);
      return '<article class="card newsitem"><span class="badge" style="background:' + (p.direction === 'zam' ? '#fee4e2;color:#b42318' : '#dcfae6;color:#067647') + '">' + t(p.direction === 'zam' ? 'ZAM' : 'İNDİRİM') + '</span> ' +
        '<h3>' + esc(p.manufacturer) + ' · ' + esc(p.material || t('Tüm ürünler')) + ' · ' + amt + '</h3>' +
        (p.note ? '<p>' + esc(p.note) + '</p>' : '') +
        '<p class="meta">' + (p.effective_date ? t('Geçerlilik:') + ' ' + dateTR(p.effective_date) + ' · ' : '') + dateTR(p.created_at) + '</p></article>';
    }).join('') + '<p class="hint">' + t('Bilgi amaçlıdır; kesin fiyat ve koşullar için bizimle iletişime geçin.') + '</p>';
  }
  const box = document.getElementById('news');
  const { data, error } = await sb.from('news').select('*').order('created_at', { ascending: false }).limit(60);
  if (error) { box.innerHTML = '<p class="form-note err">' + t('Haberler yüklenemedi.') + '</p>'; return; }
  if (!data.length) { box.innerHTML = '<p class="sub">' + t('Henüz haber yok.') + '</p>'; return; }
  box.innerHTML = data.map(n =>
    '<article class="card newsitem">' + (n.category ? '<span class="badge">' + esc(n.category) + '</span> ' : '') + (n.lang && n.lang !== 'tr' ? '<span class="badge">' + esc(n.lang.toUpperCase()) + '</span>' : '') +
    '<h3>' + esc(n.title) + '</h3><p>' + esc(n.summary) + '</p>' + (n.lang === 'tr' && n.source_title && n.source_title !== n.title ? '<p class="hint">' + t('Başlık ve özet otomatik çevrilmiştir; ayrıntı için kaynağa bakın.') + '</p>' : '') +
    '<p class="meta">' + t('Kaynak:') + ' <a href="' + esc(n.source_url) + '" target="_blank" rel="nofollow noopener">' + esc(n.source_name) + '</a>' +
    (n.source_date ? ' · ' + dateTR(n.source_date) : '') + (n.source_title ? '<br><i>“' + esc(n.source_title) + '”</i>' : '') + '</p></article>').join('');
})();
</script>
<script src="js/analytics.js" defer></script>
</body>
</html>
