<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Hammadde360 logosu">
  <defs>
    <!-- Cam küre -->
    <radialGradient id="glass" cx="40%" cy="32%" r="80%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset=".65" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset=".9" stop-color="#e6f3ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#b9dcf8" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#5aa5e6"/>
      <stop offset="1" stop-color="#14508f"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7cc4ff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/>
    </linearGradient>
    <!-- Yörünge halkası -->
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a1a"/>
      <stop offset=".35" stop-color="#8e5bd9"/>
      <stop offset=".7" stop-color="#2f7fe0"/>
      <stop offset="1" stop-color="#13b5a6"/>
    </linearGradient>
    <clipPath id="globe"><circle cx="60" cy="60" r="45"/></clipPath>

    <!-- Atom küreleri -->
    <radialGradient id="aO" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffd0a0"/><stop offset=".45" stop-color="#ff7a1a"/><stop offset="1" stop-color="#b84a00"/></radialGradient>
    <radialGradient id="aT" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#9ff3ea"/><stop offset=".45" stop-color="#13b5a6"/><stop offset="1" stop-color="#067a70"/></radialGradient>
    <radialGradient id="aP" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#d9c0ff"/><stop offset=".45" stop-color="#8e5bd9"/><stop offset="1" stop-color="#55289c"/></radialGradient>
    <radialGradient id="aB" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#b5d6ff"/><stop offset=".45" stop-color="#2f7fe0"/><stop offset="1" stop-color="#14489a"/></radialGradient>
    <radialGradient id="aG" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#c3f5b8"/><stop offset=".45" stop-color="#37b34a"/><stop offset="1" stop-color="#1b7a2b"/></radialGradient>
    <radialGradient id="aY" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fff3a8"/><stop offset=".45" stop-color="#f2c200"/><stop offset="1" stop-color="#b08600"/></radialGradient>
    <radialGradient id="aR" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffb4bd"/><stop offset=".45" stop-color="#ec3f5a"/><stop offset="1" stop-color="#9c1730"/></radialGradient>
  </defs>

  <!-- Yörünge halkası -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="url(#orbit)" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="300 40" transform="rotate(-25 60 60)"/>
  <!-- Yörünge uydusu -->
  <g>
    <circle cx="98.5" cy="21.5" r="5.6" fill="url(#aO)" stroke="#fff" stroke-width="1.6"/>
  </g>

  <!-- Saydam dünya -->
  <circle cx="60" cy="60" r="45" fill="url(#glass)"/>
  <g clip-path="url(#globe)" fill="none" stroke="#1f6fb5" stroke-opacity=".4" stroke-width="1.1">
    <ellipse cx="60" cy="60" rx="18" ry="45"/>
    <ellipse cx="60" cy="60" rx="34" ry="45"/>
    <line x1="15" y1="60" x2="105" y2="60"/>
    <path d="M18 38 Q60 46 102 38"/>
    <path d="M18 82 Q60 74 102 82"/>
    <path d="M30 20 Q60 26 90 20"/>
    <path d="M30 100 Q60 94 90 100"/>
  </g>
  <!-- Alt yansıma ve üst parlaklık -->
  <ellipse cx="60" cy="97" rx="26" ry="9" fill="url(#bottom)" clip-path="url(#globe)"/>
  <ellipse cx="44" cy="30" rx="22" ry="11" fill="url(#shine)" transform="rotate(-28 44 30)"/>
  <circle cx="60" cy="60" r="45" fill="none" stroke="url(#rim)" stroke-width="2.4"/>

  <!-- Molekül bağları -->
  <g stroke="#0b2540" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".88">
    <polygon points="60,42 75.6,51 75.6,69 60,78 44.4,69 44.4,51"/>
    <line x1="75.6" y1="51" x2="92.9" y2="41"/>
    <line x1="44.4" y1="69" x2="27.1" y2="79"/>
    <line x1="60" y1="78" x2="60" y2="94" stroke-width="3"/>
  </g>
  <!-- Halka içi (aromatik) -->
  <circle cx="60" cy="60" r="9.5" fill="none" stroke="#0b2540" stroke-opacity=".45" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Halka atomları -->
  <circle cx="60"   cy="42" r="6.8" fill="url(#aO)"/>
  <circle cx="75.6" cy="51" r="6.8" fill="url(#aT)"/>
  <circle cx="75.6" cy="69" r="6.8" fill="url(#aP)"/>
  <circle cx="60"   cy="78" r="6.8" fill="url(#aB)"/>
  <circle cx="44.4" cy="69" r="6.8" fill="url(#aG)"/>
  <circle cx="44.4" cy="51" r="6.8" fill="url(#aY)"/>
  <!-- Yan gruplar -->
  <circle cx="92.9" cy="41" r="5.6" fill="url(#aR)"/>
  <circle cx="27.1" cy="79" r="5.6" fill="url(#aT)"/>
  <circle cx="60"   cy="94" r="4.8" fill="url(#aP)"/>

  <!-- Atom parlaklıkları -->
  <g fill="#fff" fill-opacity=".75">
    <circle cx="57.8" cy="39.8" r="2"/>
    <circle cx="73.4" cy="48.8" r="2"/>
    <circle cx="73.4" cy="66.8" r="2"/>
    <circle cx="57.8" cy="75.8" r="2"/>
    <circle cx="42.2" cy="66.8" r="2"/>
    <circle cx="42.2" cy="48.8" r="2"/>
    <circle cx="91" cy="39.2" r="1.7"/>
    <circle cx="25.4" cy="77.3" r="1.7"/>
    <circle cx="58.5" cy="92.5" r="1.4"/>
  </g>
</svg>
